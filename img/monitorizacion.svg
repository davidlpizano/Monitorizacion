<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Monitorización del sistema</title>
  <desc id="description">Ilustración de un panel con métricas de procesos, memoria, disco y red.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b33"/>
      <stop offset="1" stop-color="#182d4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42d6c3"/>
      <stop offset="1" stop-color="#67a9ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1060" cy="48" r="130" fill="#67a9ff" opacity=".08"/>
  <circle cx="1120" cy="310" r="170" fill="#42d6c3" opacity=".07"/>
  <g fill="#eaf3ff" font-family="system-ui, sans-serif">
